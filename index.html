```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Card Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 14px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      background: #111;
    }

    #reader {
      width: 100%;
      flex: 1;
    }

    #reader video {
      object-fit: cover !important;
    }

    .status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      padding: 10px 16px;
      border-radius: 20px;

      font-size: 14px;
      white-space: nowrap;

      z-index: 10;
    }

    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink,
    #reader__dashboard_section_fsr {
      display: none !important;
    }

    #reader__scan_region {
      border: none !important;
    }
  </style>
</head>

<body>

  <div class="header">
    Scan Card QR
  </div>

  <div id="reader"></div>

  <div class="status" id="status">
    Point camera at QR code
  </div>


  <script>

    const APP_SCRIPT =
      "https://script.google.com/macros/s/AKfycbxNrGf9FczFmcu88H3PEettRdipRyUHOOTGHwUtPL2FPKnBC2FJGAMkZGeak522vv_2/exec";


    let scanned = false;


    function onScanSuccess(decodedText) {

      if (scanned) {
        return;
      }

      scanned = true;

      document.getElementById("status").textContent =
        "Card found";


      // Stop scanner
      html5QrcodeScanner
        .clear()
        .catch(() => {});


      // Redirect to Apps Script
      const url =
        APP_SCRIPT +
        "?id=" +
        encodeURIComponent(decodedText);


      window.location.href = url;

    }


    function onScanFailure(error) {

      // Normal scan failures are ignored.
      // The camera keeps scanning.

    }


    const html5QrcodeScanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 15,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.8;

            return {
              width: Math.floor(size),
              height: Math.floor(size)
            };

          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]

        },
        false
      );


    html5QrcodeScanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
