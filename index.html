<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Card Finder</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 6px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .scanner {
      background: white;
      padding: 16px;
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);
    }

    #reader {
      width: 100%;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      color: #6b7280;
    }

    .manual {
      margin-top: 20px;
      background: white;
      padding: 16px;
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Card Finder</h1>

  <div class="subtitle">
    Scan the QR code on your card
  </div>

  <div class="scanner">

    <div id="reader"></div>

    <div class="status" id="status">
      Starting camera...
    </div>

  </div>

  <div class="manual">

    <strong>Enter Card ID manually</strong>

    <input
      id="manualId"
      type="text"
      placeholder="BB01-BT01-C001"
    >

    <button onclick="openCard()">
      Open Card
    </button>

  </div>

</div>


<script>

  // Your existing Apps Script Web App
  const APP_SCRIPT =
    "https://script.google.com/macros/s/AKfycbxNrGf9FczFmcu88H3PEettRdipRyUHOOTGHwUtPL2FPKnBC2FJGAMkZGeak522vv_2/exec";


  let scannerStarted = false;


  function openCard(cardId) {

    if (!cardId) {

      cardId =
        document
          .getElementById("manualId")
          .value
          .trim();

    }

    if (!cardId) {

      document.getElementById("status").textContent =
        "Please scan a QR code or enter a Card ID.";

      return;

    }


    // Stop camera before redirecting
    if (scannerStarted) {

      html5QrcodeScanner
        .clear()
        .catch(() => {});

    }


    const url =
      APP_SCRIPT +
      "?id=" +
      encodeURIComponent(cardId);


    window.location.href = url;

  }


  function onScanSuccess(decodedText) {

    document.getElementById("status").textContent =
      "Card found. Opening...";


    openCard(decodedText);

  }


  function onScanFailure(error) {

    // Ignore normal scan failures.
    // The scanner checks continuously.

  }


  const html5QrcodeScanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true,

        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );


  html5QrcodeScanner.render(
    onScanSuccess,
    onScanFailure
  );

  scannerStarted = true;

</script>

</body>
</html>
